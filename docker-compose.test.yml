# Test path of the Compose setup (docs/adr/0010): runs the test suites instead of the app.
# Own project name, no published ports, no Docker volumes (docs/adr/0011), no Docker socket. Start with scripts/test.sh.
name: chargeglobe-test

services:
  test-db:
    image: timescale/timescaledb-ha:pg17
    environment:
      # Throwaway instance: reachable only inside this project's network, data in RAM.
      POSTGRES_PASSWORD: test
    tmpfs:
      # uid/gid of the postgres user in the image.
      - /home/postgres/pgdata:uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  test-smtp:
    # Catches every mail in memory; SMTP on 1025, HTTP API on 8025 (both only inside this network).
    image: axllent/mailpit:v1.31
    environment:
      # Accept any credentials over the unencrypted test connection.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  test-dotnet:
    build:
      context: .
      dockerfile: tests/Dockerfile.dotnet
    depends_on:
      test-db:
        condition: service_healthy
      test-smtp:
        condition: service_started
    environment:
      # Server connection; every test fixture creates and drops its own database.
      ConnectionStrings__TestDb: Host=test-db;Username=postgres;Password=test;Database=postgres
      # SMTP server and its HTTP API, used by the mail delivery tests.
      TestSmtp__Host: test-smtp
      TestSmtp__Port: "1025"
      TestSmtp__ApiUrl: http://test-smtp:8025
    volumes:
      - ./artifacts:/artifacts

  test-web:
    build:
      context: src/web
      dockerfile: Dockerfile.test
    volumes:
      - ./artifacts:/artifacts
