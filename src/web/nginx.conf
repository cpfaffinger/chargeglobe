server {
    # HTTPS only (docs/adr/0009). The certificate is self-signed and created by
    # docker-entrypoint.d/10-self-signed-cert.sh on first start.
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    # No Strict-Transport-Security header, neither here nor in the API: HSTS is host-wide
    # (all ports) and would block the browser exception for the self-signed certificate.
    # If wanted, the external load balancer with the valid certificate sets it.

    # Plain HTTP sent to the TLS port: redirect instead of answering 400.
    error_page 497 =301 https://$http_host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. The api container gets a new address whenever it is recreated (deploy
    # without a new web image); with a variable, nginx resolves the name again instead of keeping the
    # address from its start.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # API, OpenAPI document and Scalar UI are served by the api container. Without a URI part in
    # proxy_pass, the original request URI (path and query) is passed on.
    location ~ ^/(api|openapi|scalar)(/|$) {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MapLibre's worker is an ES module; browsers only start it with a JavaScript MIME type.
    location /maplibre/ {
        types {
            text/javascript mjs;
        }
    }

    # Angular client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
