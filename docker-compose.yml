name: chargeglobe

# Persistent data lives in bind mounts below ./data next to this file, never in Docker volumes (docs/adr/0011).
services:
  data-init:
    # One-shot: creates the data directories and hands ./data/postgres to the postgres user of the db image.
    image: timescale/timescaledb-ha:pg17
    user: root
    entrypoint: ["sh", "-c", "mkdir -p /data/postgres /data/tls /data/routing && chown 1000:1000 /data/postgres && chmod 700 /data/postgres"]
    restart: "no"
    volumes:
      - ./data:/data

  db:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chargeglobe}
      POSTGRES_USER: ${POSTGRES_USER:-chargeglobe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: chargeglobe-api
    build:
      context: .
      dockerfile: src/ChargeGlobe.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Database=${POSTGRES_DB:-chargeglobe};Username=${POSTGRES_USER:-chargeglobe};Password=${POSTGRES_PASSWORD}
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env (openssl rand -hex 32)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:5005}

  crawler:
    image: chargeglobe-jobs
    build:
      context: .
      dockerfile: src/ChargeGlobe.Jobs/Dockerfile
    command: ["--role", "crawler"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Database=${POSTGRES_DB:-chargeglobe};Username=${POSTGRES_USER:-chargeglobe};Password=${POSTGRES_PASSWORD}
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
    deploy:
      replicas: ${CRAWLER_REPLICAS:-1}

  worker:
    image: chargeglobe-jobs
    # Built by the crawler service; both roles share one image.
    pull_policy: never
    command: ["--role", "worker"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      crawler:
        condition: service_started
    environment:
      ConnectionStrings__Default: Host=db;Database=${POSTGRES_DB:-chargeglobe};Username=${POSTGRES_USER:-chargeglobe};Password=${POSTGRES_PASSWORD}
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  routing:
    # Valhalla on OpenStreetMap (docs/adr/0007), only reachable inside the compose network (api -> routing:8002).
    # Optional: starts with COMPOSE_PROFILES=routing in .env. Serves ./data/routing/valhalla_tiles.tar if present;
    # without tiles it downloads the extract and builds them, which needs several GB of memory for a while.
    # On small hosts build the tiles elsewhere with scripts/routing/build-tiles.sh and copy them (docs/02, Routing).
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    profiles: ["routing"]
    restart: unless-stopped
    depends_on:
      data-init:
        condition: service_completed_successfully
    environment:
      tile_urls: https://download.geofabrik.de/europe/austria-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      build_tar: "True"
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      force_rebuild: "False"
      server_threads: "2"
    volumes:
      - ./data/routing:/custom_files
    mem_limit: ${ROUTING_MEMORY_LIMIT:-1g}

  web:
    image: chargeglobe-web
    build:
      context: src/web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Host name for the SAN of the self-signed certificate.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:5005}
    volumes:
      - ./data/tls:/etc/nginx/tls
    ports:
      # HTTPS only (self-signed certificate, docs/adr/0009). Behind a reverse proxy on the same host,
      # CHARGEGLOBE_BIND_ADDRESS=127.0.0.1 keeps the port off the public interfaces.
      - "${CHARGEGLOBE_BIND_ADDRESS:-0.0.0.0}:${CHARGEGLOBE_PORT:-5005}:443"
